    <div>
        <h2>Student Registration Form</h2>
        <Br>
        <h3>Student Name</h4>
        <h3><input type = "Text" name = "Name"/></h4>
        <h3>Email</h4>
        <h3><input type = "email" name = "email"/></h4>
        <h3>Password</h4>
        <h3><input type = "Password" name = "Password" minlength="15"/></h4>
        <h3>Gender</h4>
        <h3><input type = "radio" name = "id">Male
        <input type = "radio" name = "id">Female</h4>
        <Br>
        <h3>Course</h4>
        <h3><select name = "dropdown" multiple size = "1"></h4>
        <option value = "BSIT" select>BSIT</option>
        <option value = "BSTM" select>BSTM</option>
        <option value = "BSHM" select>BSHM</option>
        <option value = "BSOAD" select>BSOAD</option>
        </select>
        <Br>
        <Br>
        <h3>Skills</h4>
        <h3><input type = "checkbox" name = "HTML" value="on"check/>HTML</h4>
        <h3><input type = "checkbox" name = "CSS" value="on"check/>CSS</h4>
        <h3><input type = "checkbox" name = "JAVASCRIPT" value="on"check/>JAVASCRIPT</h4>
        <br>
        <h3>Profile Picture</h4>
        <h3><input type = "file" name = "file upload" accept="image/*,.doc"></h4>
        <Br>
        <h3>Address</h4>
        <h3><textarea rows="5" cols="50" name = "description" placeholder="Enter the description here"maxlength = "500"></textarea></h4>
