<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery</title>
</head>

    <style>
        body{
            text-align: center;
            margin-top: 50px;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        .calls{
            background-color: cornflowerblue;
            margin: auto;
            padding: 20px;
            border-radius: 50px ;
            border: solid 2px black;
        }
        button{
            background-color: aquamarine;
            color: chocolate;
            padding: 15px 20px;
            border: none;
            border-radius: 50px;
        }
        table{
            display: flex;
            justify-content: center;
            border: none;
        }
    </style>

<body>

    <div class="calls">
        <h1 id="title">Hello BSIT31A</h1>

        <p class="intro">Welcome to jQuery</p>
        <p id="p2">Hello hoooo!</p>

        <a href="#">Click Me!</a>
        <br>
        <br>

        <input type="text" id="name" placeholder="Type your name">
        <br>
        <br>

        <select id="course">
            <option value="">Select Course</option>
            <option value="BSIT">BSIT</option>
            <option value="BSCS">BSCS</option>
            <option value="BSTM">BSTM</option>
        </select>

        <br>
        <br>

        <button id="btn">Click Me</button>

        <button id="btn2">Click me more</button>

        <br>
        <br>

        <p id="message">Output:</p>

        <table border="2" id="table">
            <tr>
                <th>1</th>
                <th>2</th>
                <th>3</th>
                <th>4</th>
            </tr>

            <tr>
                <td>sample text 1</td>
                <td>sample text 2</td>
                <td>sample text 3</td>
                <td>sample text 4</td>
            </tr>

            <tr>
                <td>samples 1</td>
                <td>samples 2</td>
                <td>samples 3</td>
                <td>samples 4</td>
            </tr>

            <tr>
                <td>arawko1</td>
                <td>arawko2</td>
                <td>arawko3</td>
                <td>arawko4</td>
            </tr>
        </table>

        <button id="btnhide">hide</button>
        <button id="btnshow">show</button>

        <ul>
            <li>apple</li>
            <li>mango</li>
        </ul>

        <ul>
            <li>happy</li>
            <li>birthday</li>
        </ul>
    </div>
</body>
</html>
